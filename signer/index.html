<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Signer</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">PDF Signer</div>
      <div class="actions">
        <label class="file-button">
          Open PDF
          <input id="pdfInput" type="file" accept="application/pdf" />
        </label>
        <select id="signatureSelect" aria-label="Choose signature"></select>
        <button id="addSignature" type="button" disabled>Add</button>
        <button id="deleteSelected" type="button" disabled>Delete</button>
        <button id="downloadPdf" type="button" disabled>Download PDF</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="field">
          <label for="zoomRange">Zoom</label>
          <input id="zoomRange" type="range" min="0.6" max="1.8" value="1" step="0.1" />
        </div>
        <div class="field">
          <label for="sizeRange">Signature size</label>
          <input id="sizeRange" type="range" min="60" max="260" value="150" step="5" />
        </div>
        <div id="signaturePreview" class="signature-preview"></div>
        <div id="status" class="status">Open a PDF to start.</div>
      </aside>

      <section id="viewer" class="viewer">
        <div class="empty-state">
          <strong>No PDF opened yet</strong>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
