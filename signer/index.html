    <header class="topbar">
      <div class="brand">
        <svg aria-hidden="true"><use href="#wing" /></svg>
        <span>podpisator</span>
      </div>
      <div class="actions">
        <label class="file-button">
          open pdf
          <input id="pdfInput" type="file" accept="application/pdf" />
        </label>
        <select id="signatureSelect" aria-label="Choose signature"></select>
        <button id="addSignature" type="button" disabled>add signature</button>
        <button id="deleteSelected" type="button" disabled>delete</button>
        <button id="downloadPdf" type="button" disabled>download pdf</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <div class="field">
          <label for="zoomRange">zoom</label>
          <input id="zoomRange" type="range" min="0.6" max="1.8" value="1" step="0.1" />
        </div>
        <div class="field">
          <label for="sizeRange">signature size</label>
          <input id="sizeRange" type="range" min="60" max="260" value="150" step="5" />
        </div>
        <div class="field">
          <label for="rotationRange">tilt <span id="rotationValue">0&deg;</span></label>
          <input id="rotationRange" type="range" min="-180" max="180" value="0" step="1" disabled />
        </div>
        <p class="hint">Select a placed signature to resize or tilt it. Hold Shift while rotating to snap to 15&deg;.</p>
        <div id="signaturePreview" class="signature-preview"></div>
        <div id="status" class="status">Open a PDF to start.</div>
      </aside>

      <section id="viewer" class="viewer">
        <div class="empty-state">
          <strong>No PDF opened yet</strong>
          <span>Open a PDF to place signatures and stamps.</span>
        </div>
      </section>
    </main>

    <div id="passwordOverlay" class="overlay">
      <form id="passwordForm" class="password-card">
        <svg aria-hidden="true"><use href="#wing" /></svg>
        <h2>Password required</h2>
        <p>Enter the password to unlock signatures.</p>
        <input id="passwordInput" type="password" autocomplete="current-password" autofocus />
        <div id="passwordError" class="password-error" hidden>Wrong password.</div>
        <button type="submit">unlock</button>
      </form>
    </div>

    <script type="module" src="app.js?v=3"></script>
  </body>
</html>
